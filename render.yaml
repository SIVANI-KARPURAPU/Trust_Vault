services:
  - type: web
    name: trustvault-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "flask --app backend.run db upgrade && gunicorn backend.run:app --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false

  - type: web
    name: trustvault-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: trustvault-db
    plan: free

